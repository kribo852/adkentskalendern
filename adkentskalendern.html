<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adkentskalendern</title>
    <style>
        body {
            font-family: sans-serif;
            background-image: url('backg.jpeg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            font-size: 3rem;
        }

        .controls {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .door {
            aspect-ratio: 1 / 1;
            /* Blå -> Grön -> Blå med 70% opacitet */
            background: linear-gradient(135deg, rgba(0, 102, 204, 0.7), rgba(0, 204, 153, 0.1), rgba(0, 102, 204, 0.7));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            /* En ljus, semitransparent ram som passar bättre till färgerna */
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, background 0.3s;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .door:hover {
            transform: scale(1.05);
            /* Gör luckan lite klarare vid hover */
            background: linear-gradient(135deg, rgba(0, 120, 230, 0.9), rgba(0, 220, 170, 0.9), rgba(0, 120, 230, 0.9));
        }


        .door.open {
            background-color: #fdfefe;
            color: #333;
            border-color: #ddd;
            cursor: default;
            font-size: 0.9rem;
            font-weight: normal;
            display: block;
        }

        .door.open a {
            display: block;
            margin-top: 10px;
            color: #c0392b;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .door.open a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Adkentskalendern, för månaden kentvember</h1>

    <div class="controls">
        <label for="year-select">Välj år: </label>
        <select id="year-select"></select>
    </div>

    <div class="calendar-grid" id="calendar"></div>

    <script>
        // Data till luckorna
        const doorData = [
            "kent FF", "kent musik non stop", "kent Berlin", "kent Ingenting", 
            "kent Generation Ex", "kent Coloumbus", "kent Petroleum", "kent Taxmannen", 
            "svart ridå om du var här", "hanna järver 400 slag", "kent max 500", "kent Hjärta",
            "kent 1 timme 1 minut", "kent Alla mot alla", "kent Revolt iii", "kent kevlarsjäl",
            "kent 747", "kent jag ser dig", "kent sundance kid", "kent Ånga",
            "kent Dom som försvann", "kent Blåjeans", "kent Vy från ett luftslott", "kent blåser på månen",
            "kent krossa allt", "kent töntarna", "kent palace och main", "kent saker man ser", 
            "kent Mannen i den vita hatten"
        ];

        const yearSelect = document.getElementById('year-select');
        const calendarContainer = document.getElementById('calendar');

        // Fyll select-rutan med år 2026-2036
        for (let year = 2026; year <= 2036; year++) {
            let option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
        }

        // Enkel pseudo-slumpmässig generator baserad på ett seed (året)
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function shuffleData(array, seed) {
            let shuffled = [...array];
            let currentSeed = seed;
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(seededRandom(currentSeed++) * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderCalendar() {
            const selectedYear = parseInt(yearSelect.value);
            const shuffledList = shuffleData(doorData, selectedYear);
            
            calendarContainer.innerHTML = '';

            shuffledList.forEach((text, index) => {
                const door = document.createElement('div');
                door.className = 'door';
                door.textContent = index + 1;
                
                door.onclick = function() {
                    if (!this.classList.contains('open')) {
                        this.classList.add('open');
                        
                        // Skapa YouTube-länk
                        const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(text)}`;
                        
                        this.innerHTML = `
                            <span>${text}</span>
                            <a href="${searchUrl}" target="_blank">Sök på YouTube ↗</a>
                        `;
                    }
                };
                
                calendarContainer.appendChild(door);
            });
        }

        yearSelect.onchange = renderCalendar;

        // Starta kalendern första gången
        renderCalendar();
    </script>
</body>
</html>
